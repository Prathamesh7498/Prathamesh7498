 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff7a32"/><stop offset=".5" stop-color="#ffca75"/><stop offset="1" stop-color="#46d9ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ff7a32" stop-opacity=".34"/><stop offset="1" stop-color="#ff7a32" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
