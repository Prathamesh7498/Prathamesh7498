<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d">
<title id="t">Prathamesh Langar — Cyber Shinobi Developer</title><desc id="d">Animated cyberpunk developer profile banner with glowing rings, particles and a typing headline.</desc>
