 <circle r="39" fill="none" stroke="#46d9ff" stroke-width="2" stroke-dasharray="3 6"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/></circle>
 <path d="M-15 0L-3 13 20 -17" fill="none" stroke="url(#a)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
